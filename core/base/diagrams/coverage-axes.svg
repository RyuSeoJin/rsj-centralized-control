<svg class="sd" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-labelledby="cvt cvd">
<title id="cvt">커버리지 3축 대조 — 「다 봤다」를 기계가 판정하는 방법</title>
<desc id="cvd">기획 축은 기능 골격의 구현 기능 단위를, 구현 축은 청사진에 등재된 화면 요소를, 상태 축은 기능 단위에 선언된 게이팅 상태를 기준선으로 삼습니다. TC가 케이스마다 적어 둔 좌표(covers)와 이 셋을 맞춰, 덮이지 않은 것을 목록으로 냅니다. 목록이 빌 때까지가 TC 설계이며, 검증 대상이 아닌 것은 사유와 함께 제외 파일에 적고 대조기가 그 사유의 근거까지 확인합니다.</desc>
<!--
  CHANGELOG
  v1.0 (2026-08-04) 최초 수립. 저장소 구조도(structure.svg)에서 spec/ ↔ test-case/ 구간을
                    확대한 그림이다.

  이 파일이 정본이다. 소개 생성기가 이 파일을 읽어 넣으므로 사본을 손으로
  맞출 일이 없다 — 고친 뒤 gen_intro_html.py로 「TC 설계 규칙」 페이지를
  다시 만들면 된다.

  여기에 옵션 표기를 그대로 적지 않는다. XML 주석에는 연속 하이픈을 쓸 수 없어서,
  적는 순간 이 파일이 단독으로 열리지 않는다(브라우저가 파싱 오류를 낸다).

  변환 없이 그대로 주입되므로 root의 class="sd"와 id(cvt/cvd)는 바꾸지 않는다.
  색은 밝은 배경 기준이고, HTML에서는 클래스를 CSS로 덮어 다크 테마로 표시한다.
-->
<defs>
<marker id="cv-ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker>
<marker id="cv-ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#199e70"/></marker>
<marker id="cv-ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
</defs>

<!-- 기준선 셋 -->
<rect class="grp-form" x="20" y="52" width="300" height="250" rx="8" fill="#f2f5fe" stroke="#6b74d6"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<text class="t" x="36" y="74" font-size="12.5" font-weight="500" fill="#1f2328">기준선 — 무엇을 다 봐야 하나</text>
<text class="s" x="36" y="91" font-size="11.5" fill="#57606a">정본에서 읽어 옵니다. 사람이 세지 않습니다</text>
</g>
<g class="nd-form" fill="#e3e9fd" stroke="#6b74d6">
<rect x="36" y="104" width="268" height="54" rx="6"/><rect x="36" y="168" width="268" height="54" rx="6"/><rect x="36" y="232" width="268" height="54" rx="6"/>
</g>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<text class="t" x="52" y="124" font-size="12.5" font-weight="500" fill="#1f2328">① 기획 축 — 구현 기능 단위</text>
<text class="s" x="52" y="142" font-size="11.5" fill="#57606a">기능 골격(feature-tree.md)의 말단</text>
<text class="t" x="52" y="188" font-size="12.5" font-weight="500" fill="#1f2328">② 구현 축 — 화면 요소</text>
<text class="s" x="52" y="206" font-size="11.5" fill="#57606a">청사진 §3-1에 등재된 testid</text>
<text class="t" x="52" y="252" font-size="12.5" font-weight="500" fill="#1f2328">③ 상태 축 — 기능 단위 × 상태</text>
<text class="s" x="52" y="270" font-size="11.5" fill="#57606a">기능 단위의 [상태:] 선언 × 게이팅 5종</text>
</g>

<!-- TC 좌표 -->
<rect class="grp-out" x="20" y="330" width="300" height="118" rx="8" fill="#eef9f4" stroke="#199e70"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<text class="t" x="36" y="352" font-size="12.5" font-weight="500" fill="#1f2328">TC가 신고한 좌표</text>
<text class="s" x="36" y="369" font-size="11.5" fill="#57606a">케이스를 쓰는 시점에 함께 적습니다</text>
</g>
<g class="nd-out" fill="#d9f2e6" stroke="#199e70"><rect x="36" y="382" width="268" height="50" rx="6"/></g>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<text class="s" x="52" y="402" font-size="11.5" fill="#1f2328">covers: ["앱 진입/세션 &gt; 진입 분기 &gt; …",</text>
<text class="s" x="52" y="420" font-size="11.5" fill="#1f2328">         "g-nav-chat", "g-login-modal"] + 상태 열</text>
</g>

<!-- 대조기 -->
<rect class="nd-proc" x="400" y="196" width="150" height="96" rx="8" fill="#e0eefb" stroke="#3987e5"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif" text-anchor="middle">
<text class="t" x="475" y="230" font-size="13" font-weight="500" fill="#1f2328">대조기</text>
<text class="s" x="475" y="250" font-size="11.5" fill="#57606a">check_tc_</text>
<text class="s" x="475" y="266" font-size="11.5" fill="#57606a">coverage.py</text>
</g>

<!-- 산출 -->
<rect class="grp-warn" x="630" y="52" width="290" height="180" rx="8" fill="#fff5ed" stroke="#c2410c"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<text class="t" x="646" y="74" font-size="12.5" font-weight="500" fill="#1f2328">덮이지 않은 것</text>
<text class="s" x="646" y="91" font-size="11.5" fill="#57606a">이 목록이 빌 때까지가 TC 설계</text>
</g>
<g class="nd-warn" fill="#fde8d7" stroke="#c2410c">
<rect x="646" y="104" width="258" height="34" rx="6"/><rect x="646" y="146" width="258" height="34" rx="6"/><rect x="646" y="188" width="258" height="34" rx="6"/>
</g>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<text class="s" x="662" y="126" font-size="11.5" fill="#1f2328">덮이지 않은 기능 단위 · 화면 요소</text>
<text class="s" x="662" y="168" font-size="11.5" fill="#1f2328">기능 단위 × 상태 — 미검증 조합</text>
<text class="s" x="662" y="210" font-size="11.5" fill="#1f2328">좌표 오타 · 기능 단위를 겸해 덮은 TC</text>
</g>

<!-- 제외 -->
<rect class="grp-proc" x="630" y="270" width="290" height="178" rx="8" fill="#f0f7fd" stroke="#3987e5"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<text class="t" x="646" y="292" font-size="12.5" font-weight="500" fill="#1f2328">검증 대상이 아닌 것 — 제외</text>
<text class="s" x="646" y="309" font-size="11.5" fill="#57606a">누락이 아니라 판단이므로 사유가 함께</text>
</g>
<g class="nd-proc" fill="#e0eefb" stroke="#3987e5"><rect x="646" y="322" width="258" height="110" rx="6"/></g>
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<text class="s" x="662" y="344" font-size="11.5" fill="#1f2328">kind — 제외의 성격</text>
<text class="s" x="662" y="366" font-size="11.5" fill="#1f2328">reason — 사유(없으면 제외로 인정 안 함)</text>
<text class="s" x="662" y="388" font-size="11.5" fill="#1f2328">requires — 그 사유가 기대는 근거</text>
<text class="s" x="662" y="414" font-size="11.5" fill="#57606a">근거가 사라지면 대조가 실패합니다 —</text>
<text class="s" x="662" y="430" font-size="11.5" fill="#57606a">판단이 낡는 것을 기계가 잡습니다</text>
</g>

<!-- 화살표 -->
<path class="arrow arrow-gray" d="M324,131 H364 V236 H394" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#cv-ar-gray)"/>
<path class="arrow arrow-gray" d="M324,195 H364 V236 H394" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#cv-ar-gray)"/>
<path class="arrow arrow-gray" d="M324,259 H364 V236 H394" fill="none" stroke="#6e7781" stroke-width="1.6" marker-end="url(#cv-ar-gray)"/>
<path class="arrow arrow-green" d="M324,407 H364 V244 H394" fill="none" stroke="#199e70" stroke-width="1.8" marker-end="url(#cv-ar-green)"/>
<path class="arrow arrow-red" d="M556,222 H592 V140 H624" fill="none" stroke="#c2410c" stroke-width="1.8" marker-end="url(#cv-ar-red)"/>
<path class="arrow" d="M624,352 H592 V262 H556" fill="none" stroke="#3987e5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cv-ar-gray)"/>

<!-- 한 줄 요지 -->
<g font-family="system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<text class="t" x="20" y="30" font-size="13.5" font-weight="600" fill="#1f2328">커버리지 3축 대조 — 「다 봤다」를 감이 아니라 대조로 보증합니다</text>
<text class="s" x="20" y="480" font-size="11.5" fill="#57606a">한 축만 보면 반대쪽이 통째로 샙니다 — 기획 축만 보면 푸터 링크·빈 상태 안내가 빠지고, 구현 축만 보면 집계·격리처럼 화면에 드러나지 않는 규칙이 빠집니다.</text>
<text class="s" x="20" y="500" font-size="11.5" fill="#57606a">기능 단위 하나가 여러 게이팅 상태를 묶고 있으면 기능 단위 단위 대조로는 「그중 한 상태의 케이스를 안 썼다」를 못 잡습니다. 그래서 상태 축을 따로 둡니다.</text>
</g>
</svg>
