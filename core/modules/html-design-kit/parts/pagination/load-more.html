<section data-part="pagination" data-variant="load-more" class="hdk-pagination hdk-pagination--load-more">
<style>
.hdk-pagination--load-more { display: flex; flex-direction: column; align-items: center; gap: var(--hdk-sp-2); padding: var(--hdk-sp-4) 0; }
.hdk-pagination--load-more .hdk-pagination__meta { font-size: var(--hdk-fs-xs); color: var(--hdk-fg-faint); }
.hdk-pagination--load-more .hdk-pagination__bar { width: 160px; height: 3px; background: var(--hdk-line); border-radius: var(--hdk-radius-full); overflow: hidden; } /* 구조 치수 */
.hdk-pagination--load-more .hdk-pagination__bar i { display: block; height: 100%; width: var(--pagination-progress, 30%); background: var(--hdk-accent); }
</style>
  <span class="hdk-pagination__meta" data-slot="meta">0개 중 0개 표시</span>
  <span class="hdk-pagination__bar" aria-hidden="true"><i></i></span>
  <span data-slot="cta"><!-- button.outline "더 보기" --></span>
</section>
