<!--
part: avatar
variant: with-name
source: ColorlibHQ/gentelella
fits: topbar, table, feed, card
mood: dense, corporate
slots: image, label, title, meta
requires: none
added: 2026-08-25
spec: 0.5
notes: 아바타 + 이름 + 부가정보(직함·이메일) 가로 배치. 표 셀·댓글 헤더·탑바 사용자 메뉴용
-->
<section data-part="avatar" data-variant="with-name" class="hdk-avatar hdk-avatar--with-name">
<style>
.hdk-avatar--with-name { display: inline-flex; align-items: center; gap: var(--hdk-sp-3); }
.hdk-avatar--with-name .hdk-avatar__img { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: var(--hdk-radius-full); background: var(--hdk-accent-soft); color: var(--hdk-accent); font-size: var(--hdk-fs-sm); font-weight: var(--hdk-fw-medium); overflow: hidden; }
.hdk-avatar--with-name .hdk-avatar__img img { width: 100%; height: 100%; object-fit: cover; }
.hdk-avatar--with-name .hdk-avatar__title { margin: 0; font-size: var(--hdk-fs-sm); font-weight: var(--hdk-fw-medium); line-height: var(--hdk-lh-tight); }
.hdk-avatar--with-name .hdk-avatar__meta { margin: 2px 0 0; font-size: var(--hdk-fs-xs); color: var(--hdk-fg-muted); }
</style>
  <span class="hdk-avatar__img" data-slot="image"><span data-slot="label">JH</span></span>
  <span><p class="hdk-avatar__title" data-slot="title">이름 자리</p><p class="hdk-avatar__meta" data-slot="meta">부가 정보 자리</p></span>
</section>
