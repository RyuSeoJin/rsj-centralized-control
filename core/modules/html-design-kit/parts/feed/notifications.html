<section data-part="feed" data-variant="notifications" class="hdk-feed hdk-feed--notifications">
<style>
.hdk-feed--notifications .hdk-feed__list { list-style: none; margin: 0; padding: 0; }
.hdk-feed--notifications .hdk-feed__item { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: var(--hdk-sp-3); padding: var(--hdk-sp-3) var(--hdk-sp-4) var(--hdk-sp-3) var(--hdk-sp-5); border-bottom: 1px solid var(--hdk-line); font-size: var(--hdk-fs-sm); }

.hdk-feed--notifications .hdk-feed__item[data-unread="true"]::before { content: ""; position: absolute; left: var(--hdk-sp-2); top: 50%; width: 6px; height: 6px; border-radius: var(--hdk-radius-full); background: var(--hdk-accent); transform: translateY(-50%); }
.hdk-feed--notifications .hdk-feed__icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--hdk-radius-md); background: var(--hdk-bg-elev-2); color: var(--hdk-fg-muted); }
.hdk-feed--notifications .hdk-feed__icon svg { width: 18px; height: 18px; }
.hdk-feed--notifications .hdk-feed__title { margin: 0; font-weight: var(--hdk-fw-medium); }
.hdk-feed--notifications .hdk-feed__body { margin: 2px 0 0; color: var(--hdk-fg-muted); font-size: var(--hdk-fs-xs); }
.hdk-feed--notifications .hdk-feed__meta { display: block; margin-top: var(--hdk-sp-1); font-size: var(--hdk-fs-xs); color: var(--hdk-fg-faint); }
</style>
