<!--
part: faq
variant: grouped-tabs
source: original
fits: frame.scroll-stack, frame.sidebar-shell
mood: dense, corporate
slots: title, items, item, label, body
requires: tabs.pill
added: 2026-08-25
spec: 0.5
notes: 카테고리별 그룹. 상단 카테고리 칩(data-group)으로 필터링. 질문 15개 이상인 헬프센터용
-->
<section data-part="faq" data-variant="grouped-tabs" data-init="faq.grouped-tabs" class="hdk-faq hdk-faq--grouped-tabs">
<style>
.hdk-faq--grouped-tabs { padding: var(--hdk-sp-6) var(--hdk-sp-4); }
.hdk-faq--grouped-tabs .hdk-faq__inner { max-width: 760px; margin: 0 auto; }
.hdk-faq--grouped-tabs .hdk-faq__title { margin: 0 0 var(--hdk-sp-4); font-size: var(--hdk-fs-xl); font-weight: var(--hdk-fw-bold); }
.hdk-faq--grouped-tabs .hdk-faq__chips { display: flex; flex-wrap: wrap; gap: var(--hdk-sp-2); margin-bottom: var(--hdk-sp-4); }
.hdk-faq--grouped-tabs .hdk-faq__chip { padding: var(--hdk-sp-1) var(--hdk-sp-3); border: 1px solid var(--hdk-line-strong); border-radius: var(--hdk-radius-full); background: none; color: var(--hdk-fg-muted); font-size: var(--hdk-fs-sm); cursor: pointer; }
.hdk-faq--grouped-tabs .hdk-faq__chip[aria-pressed="true"] { background: var(--hdk-accent); color: var(--hdk-accent-fg); border-color: transparent; }
.hdk-faq--grouped-tabs details { padding: var(--hdk-sp-3) var(--hdk-sp-4); margin-bottom: var(--hdk-sp-2); background: var(--hdk-bg-elev); border: 1px solid var(--hdk-line); border-radius: var(--hdk-radius-md); }
.hdk-faq--grouped-tabs details[hidden] { display: none; }
.hdk-faq--grouped-tabs summary { cursor: pointer; font-weight: var(--hdk-fw-medium); font-size: var(--hdk-fs-sm); }
.hdk-faq--grouped-tabs .hdk-faq__body { margin: var(--hdk-sp-2) 0 0; color: var(--hdk-fg-muted); font-size: var(--hdk-fs-sm); line-height: var(--hdk-lh-loose); }
</style>
  <div class="hdk-faq__inner">
    <h2 class="hdk-faq__title" data-slot="title">도움말</h2>
    <div class="hdk-faq__chips"><button class="hdk-faq__chip" type="button" aria-pressed="true" data-group="all">전체</button><button class="hdk-faq__chip" type="button" data-group="a">그룹 A</button><button class="hdk-faq__chip" type="button" data-group="b">그룹 B</button></div>
    <div data-slot="items">
      <details data-group="a" data-slot="item"><summary data-slot="label">질문 자리 (A)</summary><p class="hdk-faq__body" data-slot="body">답변 자리</p></details>
      <details data-group="b"><summary>질문 자리 (B)</summary><p class="hdk-faq__body">답변 자리</p></details>
      <details data-group="a"><summary>질문 자리 (A)</summary><p class="hdk-faq__body">답변 자리</p></details>
    </div>
  </div>
<script>
hdk.register('faq.grouped-tabs', function (root) {const r=root,c=[...r.querySelectorAll('.hdk-faq__chip')],d=[...r.querySelectorAll('details[data-group]')];
c.forEach(b=>b.addEventListener('click',()=>{c.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const g=b.dataset.group;d.forEach(x=>x.hidden=!(g==='all'||x.dataset.group===g));}));});
</script>
</section>
