<!--
part: tabs
variant: vertical
source: tabler/tabler
fits: frame.sidebar-shell, section
mood: dense, corporate
slots: items, item, label, panels, panel
requires: none
added: 2026-08-25
spec: 0.5
notes: 좌측 세로 탭 + 우측 패널. 설정 페이지(계정/알림/보안 …)용. md 미만: 탭이 가로 스크롤로 전환
-->
<section data-part="tabs" data-variant="vertical" data-init="tabs.vertical" class="hdk-tabs hdk-tabs--vertical">
<style>
.hdk-tabs--vertical { display: grid; gap: var(--hdk-sp-4); }
.hdk-tabs--vertical .hdk-tabs__list { display: flex; gap: var(--hdk-sp-1); overflow-x: auto; margin: 0; padding: 0; list-style: none; }
.hdk-tabs--vertical .hdk-tabs__tab { padding: var(--hdk-sp-2) var(--hdk-sp-3); border: 0; background: none; border-radius: var(--hdk-radius-md); text-align: left; color: var(--hdk-fg-muted); font-size: var(--hdk-fs-sm); cursor: pointer; white-space: nowrap; }
.hdk-tabs--vertical .hdk-tabs__tab:hover { background: var(--hdk-bg-elev-2); color: var(--hdk-fg); }
.hdk-tabs--vertical .hdk-tabs__tab[aria-selected="true"] { background: var(--hdk-accent-soft); color: var(--hdk-accent); font-weight: var(--hdk-fw-medium); }
.hdk-tabs--vertical .hdk-tabs__panel { padding: var(--hdk-sp-4); background: var(--hdk-bg-elev); border: 1px solid var(--hdk-line); border-radius: var(--hdk-radius-lg); color: var(--hdk-fg-muted); font-size: var(--hdk-fs-sm); min-height: 120px; }
.hdk-tabs--vertical .hdk-tabs__panel[hidden] { display: none; }
@media (min-width: 1024px) { .hdk-tabs--vertical { grid-template-columns: 200px 1fr; } .hdk-tabs--vertical .hdk-tabs__list { flex-direction: column; overflow: visible; } } /* md */
</style>
  <div class="hdk-tabs__list" role="tablist" data-slot="items">
    <button class="hdk-tabs__tab" role="tab" aria-selected="true" data-slot="item"><span data-slot="label">탭 1</span></button>
    <button class="hdk-tabs__tab" role="tab" aria-selected="false"><span>탭 2</span></button>
    <button class="hdk-tabs__tab" role="tab" aria-selected="false"><span>탭 3</span></button>
  </div>
  <div data-slot="panels">
    <div class="hdk-tabs__panel" role="tabpanel" data-slot="panel">패널 1 내용 자리</div>
    <div class="hdk-tabs__panel" role="tabpanel" hidden>패널 2 내용 자리</div>
    <div class="hdk-tabs__panel" role="tabpanel" hidden>패널 3 내용 자리</div>
  </div>
<script>
hdk.register('tabs.vertical', function (root) {const r=root,t=[...r.querySelectorAll('.hdk-tabs__tab')],p=[...r.querySelectorAll('.hdk-tabs__panel')];
t.forEach((b,i)=>b.addEventListener('click',()=>{t.forEach((x,k)=>x.setAttribute('aria-selected',String(k===i)));p.forEach((x,k)=>x.hidden=k!==i);}));});
</script>
</section>
