<!--
part: slider
variant: thumbnail-strip
source: original
fits: section, modal
mood: dense, tech
slots: items, item, image
requires: none
added: 2026-08-25
spec: 0.5
notes: 큰 이미지 + 아래 썸네일 줄. 상품·스크린샷 갤러리. 썸네일 클릭이 data-dot 역할
-->
<section data-part="slider" data-variant="thumbnail-strip" data-init="slider.thumbnail-strip" class="hdk-slider hdk-slider--thumbnail-strip">
<style>
.hdk-slider--thumbnail-strip { display: grid; gap: var(--hdk-sp-2); }
.hdk-slider--thumbnail-strip .hdk-slider__stage { overflow: hidden; border-radius: var(--hdk-radius-lg); border: 1px solid var(--hdk-line); }
.hdk-slider--thumbnail-strip .hdk-slider__track { display: flex; transition: transform var(--hdk-dur-slow) var(--hdk-ease); }
.hdk-slider--thumbnail-strip .hdk-slider__item { flex: 0 0 100%; aspect-ratio: 16 / 10; background: var(--hdk-bg-elev-2); display: grid; place-items: center; color: var(--hdk-fg-faint); font-family: var(--hdk-font-mono); }
.hdk-slider--thumbnail-strip .hdk-slider__item img { width: 100%; height: 100%; object-fit: contain; }
.hdk-slider--thumbnail-strip .hdk-slider__thumbs { display: flex; gap: var(--hdk-sp-2); overflow-x: auto; }
.hdk-slider--thumbnail-strip .hdk-slider__thumbs button { flex: 0 0 72px; aspect-ratio: 16 / 10; padding: 0; border: 2px solid transparent; border-radius: var(--hdk-radius-md); background: var(--hdk-bg-elev-2); cursor: pointer; opacity: .6; }
.hdk-slider--thumbnail-strip .hdk-slider__thumbs button[aria-current="true"] { border-color: var(--hdk-accent); opacity: 1; }
</style>
  <div class="hdk-slider__stage"><div class="hdk-slider__track" data-slot="items"><div class="hdk-slider__item" data-slot="item"><span data-slot="image">이미지 1</span></div><div class="hdk-slider__item">이미지 2</div><div class="hdk-slider__item">이미지 3</div><div class="hdk-slider__item">이미지 4</div></div></div>
  <div class="hdk-slider__thumbs"><button type="button" data-dot aria-current="true" aria-label="1"></button><button type="button" data-dot aria-label="2"></button><button type="button" data-dot aria-label="3"></button><button type="button" data-dot aria-label="4"></button></div>
<script>
hdk.register('slider.thumbnail-strip', function (root) {const r=root,t=r.querySelector('.hdk-slider__track'),n=t.children.length;let i=0;
function go(k){i=(k+n)%n;t.style.transform='translateX(-'+(i*100)+'%)';r.querySelectorAll('[data-dot]').forEach((d,j)=>d.setAttribute('aria-current',String(j===i)));}
r.querySelectorAll('[data-action="prev"]').forEach(b=>b.onclick=()=>go(i-1));r.querySelectorAll('[data-action="next"]').forEach(b=>b.onclick=()=>go(i+1));
r.querySelectorAll('[data-dot]').forEach((d,j)=>d.onclick=()=>go(j));});
</script>
</section>
