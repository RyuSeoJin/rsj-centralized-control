<section data-part="button" data-variant="link" class="hdk-button hdk-button--link">
<style>
.hdk-button--link { display: inline-flex; }
.hdk-button--link .hdk-button__btn { display: inline-flex; align-items: center; gap: var(--hdk-sp-1); padding: 0; background: none; border: 0; color: var(--hdk-accent); font-size: var(--hdk-fs-sm); font-weight: var(--hdk-fw-medium); cursor: pointer; }
.hdk-button--link .hdk-button__btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.hdk-button--link .hdk-button__icon { width: 14px; height: 14px; transition: transform var(--hdk-dur-fast) var(--hdk-ease); }
.hdk-button--link .hdk-button__btn:hover .hdk-button__icon { transform: translateX(3px); }
</style>
