<section data-part="badge" data-variant="count" class="hdk-badge hdk-badge--count" data-tone="accent">
<style>
.hdk-badge--count { display: inline-flex; }
.hdk-badge--count .hdk-badge__chip {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 6px; /* 구조 치수: 한 자리도 원형 유지 */
  border-radius: var(--hdk-radius-full);
  font-family: var(--hdk-font-mono); font-size: var(--hdk-fs-xs); font-weight: var(--hdk-fw-bold); line-height: 1;
  font-variant-numeric: tabular-nums;
  background: var(--hdk-bg-elev-2); color: var(--hdk-fg);
}
.hdk-badge--count[data-tone="accent"] .hdk-badge__chip { background: var(--hdk-accent); color: var(--hdk-accent-fg); }
.hdk-badge--count[data-tone="danger"] .hdk-badge__chip { background: var(--hdk-danger); color: var(--hdk-bg); }
</style>
  <span class="hdk-badge__chip" data-slot="value">0</span>
</section>
