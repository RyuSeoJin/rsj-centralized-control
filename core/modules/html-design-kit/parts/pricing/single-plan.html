<section data-part="pricing" data-variant="single-plan" class="hdk-pricing hdk-pricing--single-plan">
<style>
.hdk-pricing--single-plan { padding: var(--hdk-sp-8) var(--hdk-sp-4); }
.hdk-pricing--single-plan .hdk-pricing__inner { max-width: 900px; margin: 0 auto; display: grid; background: var(--hdk-bg-elev); border: 1px solid var(--hdk-line); border-radius: var(--hdk-radius-lg); overflow: hidden; }

.hdk-pricing--single-plan .hdk-pricing__right { padding: var(--hdk-sp-6); background: var(--hdk-bg-elev-2); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--hdk-sp-2); }
