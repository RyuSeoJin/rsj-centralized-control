<section data-part="empty-state" data-variant="illustration" class="hdk-empty-state hdk-empty-state--illustration">
<style>
.hdk-empty-state--illustration {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: var(--hdk-sp-3); padding: var(--hdk-sp-8) var(--hdk-sp-4);
}
.hdk-empty-state--illustration .hdk-empty-state__illustration {
  width: 120px; height: 120px; /* 구조 치수 */
  display: grid; place-items: center;
  background: var(--hdk-accent-soft); color: var(--hdk-accent);
  border-radius: var(--hdk-radius-full); margin-bottom: var(--hdk-sp-2);
}
.hdk-empty-state--illustration .hdk-empty-state__illustration svg { width: 56px; height: 56px; }
.hdk-empty-state--illustration .hdk-empty-state__title { margin: 0; font-family: var(--hdk-font-display); font-size: var(--hdk-fs-xl); font-weight: var(--hdk-fw-bold); line-height: var(--hdk-lh-tight); }
.hdk-empty-state--illustration .hdk-empty-state__body { margin: 0; color: var(--hdk-fg-muted); max-width: 44ch; }
.hdk-empty-state--illustration .hdk-empty-state__actions { display: flex; gap: var(--hdk-sp-2); margin-top: var(--hdk-sp-3); flex-wrap: wrap; justify-content: center; }
</style>

  <div class="hdk-empty-state__actions">
