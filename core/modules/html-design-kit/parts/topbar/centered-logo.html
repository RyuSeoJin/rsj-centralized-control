<section data-part="topbar" data-variant="centered-logo" class="hdk-topbar hdk-topbar--centered-logo">
<style>
.hdk-topbar--centered-logo { background: var(--hdk-bg); border-bottom: 1px solid var(--hdk-line); }
.hdk-topbar--centered-logo .hdk-topbar__inner { max-width: var(--hdk-container); margin: 0 auto; height: var(--hdk-topbar-h); padding: 0 var(--hdk-sp-4); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.hdk-topbar--centered-logo .hdk-topbar__nav { display: none; gap: var(--hdk-sp-5); list-style: none; margin: 0; padding: 0; }
.hdk-topbar--centered-logo .hdk-topbar__nav--right { justify-content: flex-end; }
.hdk-topbar--centered-logo .hdk-topbar__nav a { color: var(--hdk-fg-muted); text-decoration: none; font-size: var(--hdk-fs-xs); letter-spacing: var(--hdk-tracking-caps); text-transform: uppercase; }
.hdk-topbar--centered-logo .hdk-topbar__nav a:hover { color: var(--hdk-fg); }
.hdk-topbar--centered-logo .hdk-topbar__logo { grid-column: 2; font-family: var(--hdk-font-display); font-weight: var(--hdk-fw-bold); font-size: var(--hdk-fs-xl); text-decoration: none; color: var(--hdk-fg); letter-spacing: -0.02em; }
.hdk-topbar--centered-logo .hdk-topbar__burger { grid-column: 3; justify-self: end; border: 0; background: none; color: var(--hdk-fg); cursor: pointer; }
@media (min-width: 1024px) { .hdk-topbar--centered-logo .hdk-topbar__nav { display: flex; } .hdk-topbar--centered-logo .hdk-topbar__burger { display: none; } } /* md */
</style>
  <div class="hdk-topbar__inner">
    <ul class="hdk-topbar__nav" data-slot="nav"><li><a href="#">링크 자리</a></li><li><a href="#">링크 자리</a></li></ul>
    <a class="hdk-topbar__logo" href="#" data-slot="logo">로고 자리</a>
    <ul class="hdk-topbar__nav hdk-topbar__nav--right"><li><a href="#">링크 자리</a></li><li><a href="#">링크 자리</a></li></ul>
    <button class="hdk-topbar__burger" type="button" data-action="open-menu" aria-label="메뉴"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
  </div>
</section>
