<!--
part: table
variant: data-grid
source: ColorlibHQ/gentelella
fits: frame.sidebar-shell, section, card
mood: dense, corporate
slots: title, actions, items, item, meta
requires: badge.pill, button.ghost, pagination
added: 2026-08-25
spec: 0.5
notes: 어드민 데이터 표. 헤더 행 고정(sticky), 행 hover, 숫자 열은 data-align="num". 작은 화면에서는 가로 스크롤
-->
<section data-part="table" data-variant="data-grid" class="hdk-table hdk-table--data-grid">
<style>
.hdk-table--data-grid { background: var(--hdk-bg-elev); border: 1px solid var(--hdk-line); border-radius: var(--hdk-radius-lg); overflow: hidden; }
.hdk-table--data-grid .hdk-table__head { display: flex; align-items: center; gap: var(--hdk-sp-3); padding: var(--hdk-sp-3) var(--hdk-sp-4); border-bottom: 1px solid var(--hdk-line); }
.hdk-table--data-grid .hdk-table__title { margin: 0; font-size: var(--hdk-fs-md); font-weight: var(--hdk-fw-medium); }
.hdk-table--data-grid .hdk-table__actions { margin-left: auto; display: flex; gap: var(--hdk-sp-2); }
.hdk-table--data-grid .hdk-table__scroll { overflow-x: auto; }
.hdk-table--data-grid table { width: 100%; border-collapse: collapse; font-size: var(--hdk-fs-sm); }
.hdk-table--data-grid th { position: sticky; top: 0; background: var(--hdk-bg-elev); text-align: left; padding: var(--hdk-sp-2) var(--hdk-sp-4);
  font-size: var(--hdk-fs-xs); font-weight: var(--hdk-fw-medium); color: var(--hdk-fg-faint); letter-spacing: var(--hdk-tracking-caps); text-transform: uppercase; border-bottom: 1px solid var(--hdk-line); white-space: nowrap; }
.hdk-table--data-grid td { padding: var(--hdk-sp-3) var(--hdk-sp-4); border-bottom: 1px solid var(--hdk-line); white-space: nowrap; }
.hdk-table--data-grid tbody tr:last-child td { border-bottom: 0; }
.hdk-table--data-grid tbody tr:hover td { background: var(--hdk-bg-elev-2); }
.hdk-table--data-grid [data-align="num"] { text-align: right; font-family: var(--hdk-font-mono); font-variant-numeric: tabular-nums; }
.hdk-table--data-grid .hdk-table__foot { display: flex; align-items: center; justify-content: space-between; padding: var(--hdk-sp-2) var(--hdk-sp-4); border-top: 1px solid var(--hdk-line); font-size: var(--hdk-fs-xs); color: var(--hdk-fg-faint); }
</style>
  <div class="hdk-table__head"><h3 class="hdk-table__title" data-slot="title">표 제목 자리</h3><div class="hdk-table__actions" data-slot="actions"><!-- button.ghost --></div></div>
  <div class="hdk-table__scroll"><table>
    <thead><tr><th>열 라벨</th><th>열 라벨</th><th>상태</th><th data-align="num">수치</th><th></th></tr></thead>
    <tbody data-slot="items">
      <tr data-slot="item"><td>셀 값 자리</td><td>셀 값 자리</td><td><!-- badge.pill --></td><td data-align="num">0</td><td><!-- button.ghost icon-only --></td></tr>
    </tbody>
  </table></div>
  <div class="hdk-table__foot"><span data-slot="meta">건수 정보 자리</span><span><!-- pagination --></span></div>
</section>
