<!--
part: sidebar
variant: collapsible-icon
source: ColorlibHQ/gentelella
fits: frame.sidebar-shell
mood: dense, corporate
slots: logo, items, item, icon, label, meta
requires: badge.count
added: 2026-08-25
spec: 0.5
notes: 그룹 라벨 + 아이콘/텍스트 메뉴. 부모 frame 이 data-collapsed="true" 면 라벨 숨김(아이콘만). 활성 항목은 aria-current="page"
-->
<section data-part="sidebar" data-variant="collapsible-icon" class="hdk-sidebar hdk-sidebar--collapsible-icon">
<style>
.hdk-sidebar--collapsible-icon { display: flex; flex-direction: column; height: 100%; padding: var(--hdk-sp-3) 0; }
.hdk-sidebar--collapsible-icon .hdk-sidebar__logo { display: flex; align-items: center; gap: var(--hdk-sp-3); padding: var(--hdk-sp-2) var(--hdk-sp-4) var(--hdk-sp-4);
  font-family: var(--hdk-font-display); font-weight: var(--hdk-fw-bold); font-size: var(--hdk-fs-lg); white-space: nowrap; overflow: hidden; }
.hdk-sidebar--collapsible-icon .hdk-sidebar__mark { width: 28px; height: 28px; flex: none; border-radius: var(--hdk-radius-md); background: var(--hdk-accent); } /* 구조 치수 */
.hdk-sidebar--collapsible-icon .hdk-sidebar__group { margin: var(--hdk-sp-3) var(--hdk-sp-4) var(--hdk-sp-1); font-size: var(--hdk-fs-xs); color: var(--hdk-fg-faint); letter-spacing: var(--hdk-tracking-caps); text-transform: uppercase; white-space: nowrap; overflow: hidden; }
.hdk-sidebar--collapsible-icon .hdk-sidebar__list { list-style: none; margin: 0; padding: 0 var(--hdk-sp-2); }
.hdk-sidebar--collapsible-icon .hdk-sidebar__link { display: flex; align-items: center; gap: var(--hdk-sp-3); padding: var(--hdk-sp-2) var(--hdk-sp-3);
  border-radius: var(--hdk-radius-md); color: var(--hdk-fg-muted); text-decoration: none; font-size: var(--hdk-fs-sm); white-space: nowrap;
  transition: background var(--hdk-dur-fast) var(--hdk-ease), color var(--hdk-dur-fast) var(--hdk-ease); }
.hdk-sidebar--collapsible-icon .hdk-sidebar__link:hover { background: var(--hdk-bg-elev-2); color: var(--hdk-fg); }
.hdk-sidebar--collapsible-icon .hdk-sidebar__link[aria-current="page"] { background: var(--hdk-accent-soft); color: var(--hdk-accent); font-weight: var(--hdk-fw-medium); }
.hdk-sidebar--collapsible-icon .hdk-sidebar__icon { width: 18px; height: 18px; flex: none; }
.hdk-sidebar--collapsible-icon .hdk-sidebar__label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.hdk-sidebar--collapsible-icon .hdk-sidebar__meta { margin-left: auto; }
.hdk-sidebar--collapsible-icon .hdk-sidebar__bottom { margin-top: auto; padding: var(--hdk-sp-3) var(--hdk-sp-4) 0; border-top: 1px solid var(--hdk-line); font-size: var(--hdk-fs-xs); color: var(--hdk-fg-faint); white-space: nowrap; overflow: hidden; }
[data-collapsed="true"] .hdk-sidebar--collapsible-icon .hdk-sidebar__label,
[data-collapsed="true"] .hdk-sidebar--collapsible-icon .hdk-sidebar__meta,
[data-collapsed="true"] .hdk-sidebar--collapsible-icon .hdk-sidebar__group,
[data-collapsed="true"] .hdk-sidebar--collapsible-icon .hdk-sidebar__logo span,
[data-collapsed="true"] .hdk-sidebar--collapsible-icon .hdk-sidebar__bottom { display: none; }
[data-collapsed="true"] .hdk-sidebar--collapsible-icon .hdk-sidebar__link { justify-content: center; }
</style>
  <div class="hdk-sidebar__logo" data-slot="logo"><i class="hdk-sidebar__mark" aria-hidden="true"></i><span>서비스명 자리</span></div>
  <div class="hdk-sidebar__group">그룹 라벨 자리</div>
  <ul class="hdk-sidebar__list" data-slot="items">
    <li data-slot="item"><a class="hdk-sidebar__link" href="#" aria-current="page">
      <svg class="hdk-sidebar__icon" data-slot="icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="10" y="2" width="6" height="6" rx="1"/><rect x="2" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/></svg>
      <span class="hdk-sidebar__label" data-slot="label">메뉴 라벨 자리</span>
      <span class="hdk-sidebar__meta" data-slot="meta"><!-- badge.count --></span></a></li>
  </ul>
  <div class="hdk-sidebar__bottom">하단 정보 자리 (버전·사용자)</div>
</section>
