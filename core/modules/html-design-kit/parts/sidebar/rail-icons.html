<section data-part="sidebar" data-variant="rail-icons" class="hdk-sidebar hdk-sidebar--rail-icons">
<style>
.hdk-sidebar--rail-icons { display: flex; flex-direction: column; align-items: center; height: 100%; padding: var(--hdk-sp-3) 0; gap: var(--hdk-sp-2); }
.hdk-sidebar--rail-icons .hdk-sidebar__logo { width: 36px; height: 36px; border-radius: var(--hdk-radius-md); background: var(--hdk-accent); margin-bottom: var(--hdk-sp-3); } /* 구조 치수 */
.hdk-sidebar--rail-icons .hdk-sidebar__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--hdk-sp-1); }
.hdk-sidebar--rail-icons .hdk-sidebar__link { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--hdk-radius-md); color: var(--hdk-fg-muted); }
.hdk-sidebar--rail-icons .hdk-sidebar__link:hover { background: var(--hdk-bg-elev-2); color: var(--hdk-fg); }
.hdk-sidebar--rail-icons .hdk-sidebar__link[aria-current="page"] { background: var(--hdk-accent-soft); color: var(--hdk-accent); }
.hdk-sidebar--rail-icons .hdk-sidebar__link[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 12px; bottom: 12px; width: 3px; border-radius: var(--hdk-radius-full); background: var(--hdk-accent); }
.hdk-sidebar--rail-icons .hdk-sidebar__icon { width: 20px; height: 20px; }
.hdk-sidebar--rail-icons .hdk-sidebar__label { position: absolute; left: calc(100% + var(--hdk-sp-2)); top: 50%; transform: translateY(-50%); padding: var(--hdk-sp-1) var(--hdk-sp-2);
  background: var(--hdk-fg); color: var(--hdk-bg); font-size: var(--hdk-fs-xs); border-radius: var(--hdk-radius-sm); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--hdk-dur-fast); z-index: 30; }
.hdk-sidebar--rail-icons .hdk-sidebar__link:hover .hdk-sidebar__label, .hdk-sidebar--rail-icons .hdk-sidebar__link:focus-visible .hdk-sidebar__label { opacity: 1; }
</style>
  <i class="hdk-sidebar__logo" data-slot="logo" aria-hidden="true"></i>
  <ul class="hdk-sidebar__list" data-slot="items">
    <li data-slot="item"><a class="hdk-sidebar__link" href="#" aria-current="page"><svg class="hdk-sidebar__icon" data-slot="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg><span class="hdk-sidebar__label" data-slot="label">메뉴 라벨 자리</span></a></li>
    <li><a class="hdk-sidebar__link" href="#"><svg class="hdk-sidebar__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="7"/></svg><span class="hdk-sidebar__label">메뉴 라벨 자리</span></a></li>
  </ul>
</section>
