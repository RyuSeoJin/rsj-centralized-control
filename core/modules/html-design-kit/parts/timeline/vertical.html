<section data-part="timeline" data-variant="vertical" class="hdk-timeline hdk-timeline--vertical">
<style>
.hdk-timeline--vertical .hdk-timeline__list { list-style: none; margin: 0; padding: 0 0 0 var(--hdk-sp-5); border-left: 1px solid var(--hdk-line-strong); display: grid; gap: var(--hdk-sp-5); }
.hdk-timeline--vertical .hdk-timeline__item { position: relative; }
.hdk-timeline--vertical .hdk-timeline__item::before { content: ""; position: absolute; left: calc(-1 * var(--hdk-sp-5) - 6px); top: 4px; width: 11px; height: 11px; border-radius: var(--hdk-radius-full); background: var(--hdk-fg-faint); border: 2px solid var(--hdk-bg); }
.hdk-timeline--vertical .hdk-timeline__item[data-tone="accent"]::before { background: var(--hdk-accent); }
.hdk-timeline--vertical .hdk-timeline__item[data-tone="success"]::before { background: var(--hdk-success); }
.hdk-timeline--vertical .hdk-timeline__item[data-tone="danger"]::before { background: var(--hdk-danger); }
.hdk-timeline--vertical .hdk-timeline__meta { margin: 0; font-family: var(--hdk-font-mono); font-size: var(--hdk-fs-xs); color: var(--hdk-fg-faint); }
.hdk-timeline--vertical .hdk-timeline__title { margin: 2px 0; font-size: var(--hdk-fs-sm); font-weight: var(--hdk-fw-medium); }
.hdk-timeline--vertical .hdk-timeline__body { margin: 0; font-size: var(--hdk-fs-sm); color: var(--hdk-fg-muted); }
</style>
  <ul class="hdk-timeline__list" data-slot="items">
    <li class="hdk-timeline__item" data-tone="accent" data-slot="item"><p class="hdk-timeline__meta" data-slot="meta">시각 자리</p><p class="hdk-timeline__title" data-slot="title">사건 제목 자리</p><p class="hdk-timeline__body" data-slot="body">설명 자리</p></li>
    <li class="hdk-timeline__item"><p class="hdk-timeline__meta">시각 자리</p><p class="hdk-timeline__title">사건 제목 자리</p></li>
    <li class="hdk-timeline__item" data-tone="success"><p class="hdk-timeline__meta">시각 자리</p><p class="hdk-timeline__title">사건 제목 자리</p></li>
  </ul>
</section>
